version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: health-tech-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - health-tech-network
    command: mongod --replSet rs0

  init:
    build:
      context: ..
      dockerfile: migrate/Dockerfile
    container_name: health-tech-init
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/health-tech?replicaSet=rs0
    networks:
      - health-tech-network

volumes:
  mongodb_data:
    driver: local

networks:
  health-tech-network:
    driver: bridge
    